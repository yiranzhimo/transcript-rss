name: Update transcript feeds

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transcript-rss-pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Pin workflow revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build enabled source matrix
        id: sources
        run: |
          python -m pip install "PyYAML>=6.0,<7"
          python scripts/list_enabled_sources.py config.yaml >> "${GITHUB_OUTPUT}"

  process:
    name: Process ${{ matrix.source }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Whisper models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            faster-whisper-${{ runner.os }}-

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --editable ".[transcribe]"

      - name: Process source
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SOURCE_ID: ${{ matrix.source }}
        run: |
          transcript-feed --config config.yaml sync \
            --source "${SOURCE_ID}" \
            --artifact-dir "${RUNNER_TEMP}/source-result"

      - name: Upload source result
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.source }}
          path: ${{ runner.temp }}/source-result
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - plan
      - process
    if: ${{ always() && needs.plan.result == 'success' && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      PYTHONUNBUFFERED: "1"
      SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Download source results
        uses: actions/download-artifact@v5
        with:
          pattern: source-*
          path: artifacts

      - name: Merge results and build transcript feeds
        run: |
          transcript-feed --config config.yaml merge-artifacts \
            --artifacts-dir artifacts

      - name: Commit generated files and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update transcript feeds"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
