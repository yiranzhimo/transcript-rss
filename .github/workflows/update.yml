name: Update transcript feeds

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transcript-rss-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"
    services:
      youtube-pot-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        ports:
          - 4416:4416
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Deno for YouTube challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Whisper models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            faster-whisper-${{ runner.os }}-

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --editable ".[transcribe]"

      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [[ -n "${YOUTUBE_COOKIES_B64}" ]]; then
            printf '%s' "${YOUTUBE_COOKIES_B64}" | base64 --decode > "${RUNNER_TEMP}/youtube-cookies.txt"
            chmod 600 "${RUNNER_TEMP}/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=${RUNNER_TEMP}/youtube-cookies.txt" >> "${GITHUB_ENV}"
          fi

      - name: Build transcript feeds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          YOUTUBE_POT_PROVIDER_URL: http://127.0.0.1:4416
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
        run: transcript-feed --config config.yaml sync

      - name: Commit generated files and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update transcript feeds"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
