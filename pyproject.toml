[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-rss"
version = "0.1.0"
description = "Turn podcast feeds and YouTube channels into Chinese transcript RSS feeds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
transcribe = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
transcript-feed = "transcript_rss.cli:main"

[tool.setuptools.packages.find]
include = ["transcript_rss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
