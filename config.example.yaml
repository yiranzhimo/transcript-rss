site:
  title: "我的播客与视频文字版"
  description: "自动生成的中文文字稿；请回到原始节目核对重要内容。"
  base_url: "https://USERNAME.github.io/transcript-rss"
  output_dir: "docs"
  state_file: "data/state.json"
  feed_items: 30
  content_mode: "full"
  content_max_characters: 120000

translation:
  enabled: true
  api_base: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o-mini"
  api_key_env: "OPENROUTER_API_KEY"
  chunk_characters: 6000

transcription:
  enabled: true
  model: "small"
  device: "cpu"
  compute_type: "int8"
  batch_size: 8
  beam_size: 1
  cpu_threads: 4
  log_progress: true
  max_download_mb: 500

sources:
  - id: "example-podcast"
    type: "podcast"
    url: "https://example.com/podcast.xml"
    language: "en"
    max_items_per_run: 1
    scan_limit: 15

  - id: "example-youtube"
    type: "youtube"
    # 推荐用官方 Atom feed（不经过 yt-dlp，几乎不会被限流）：
    # https://www.youtube.com/feeds/videos.xml?channel_id=UCxxxxxxxxxxxxxxxxxxxxxx
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCxxxxxxxxxxxxxxxxxxxxxx"
    language: "auto"
    max_items_per_run: 1
    scan_limit: 15
