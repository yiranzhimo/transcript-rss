# Replace the disabled examples with your podcast feeds and YouTube channels.
site:
  title: "我的播客与视频文字版"
  description: "自动生成的中文文字稿；重要内容请回到原始节目核对。"
  base_url: "https://yiranzhimo.github.io/transcript-rss"
  output_dir: "docs"
  state_file: "data/state.json"
  feed_items: 30
  content_mode: "full"
  content_max_characters: 120000

translation:
  enabled: true
  api_base: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o-mini"
  api_key_env: "OPENROUTER_API_KEY"
  chunk_characters: 6000

transcription:
  enabled: true
  model: "small"
  device: "cpu"
  compute_type: "int8"
  batch_size: 8
  beam_size: 1
  cpu_threads: 4
  log_progress: true
  max_download_mb: 500

